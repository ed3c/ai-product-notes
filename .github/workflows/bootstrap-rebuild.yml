name: bootstrap-rebuild

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-rebuild.yml'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild canonical repository tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-v2/payload.* | base64 -d > /tmp/ai-product-notes.tar.gz
          echo "6a54b3d74a3e8c8a726b622e3913dc5f7861406dbc5c0c010517acbe4e1917ca  /tmp/ai-product-notes.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ai-product-notes.tar.gz -C .
          rm -rf .bootstrap .bootstrap-v2 .github/workflows/bootstrap-rebuild.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: migrate AI product intelligence to GitHub canonical store"
          git push origin HEAD:main
